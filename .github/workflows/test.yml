name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: /tmp/mcp-nix-tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: uv sync --locked
      - run: make check
      - run: make pyixx-check
      - run: cargo fmt --manifest-path pyixx/Cargo.toml --check
      - run: make test

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_CACHE_HOME: /tmp/mcp-nix-live
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1.6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      - run: make test-live

  nix:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).startup" --no-link
