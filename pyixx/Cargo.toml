[package]
name = "pyixx"
version = "0.2.0"
edition = "2021"

[lib]
name = "pyixx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
libixx = { git = "https://github.com/NuschtOS/ixx", rev = "1b3c8be72baf29a225e21715a941f48b520d5281" }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
